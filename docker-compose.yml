services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jcimmo}
      POSTGRES_USER: ${POSTGRES_USER:-jcimmo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jcimmo_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcimmo_user} -d ${POSTGRES_DB:-jcimmo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-jcimmo_user}:${POSTGRES_PASSWORD:-jcimmo_dev_password}@postgres:5432/${POSTGRES_DB:-jcimmo}}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?ADMIN_SECRET_KEY muss in Coolify gesetzt werden}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      PROXY_URL: ${PROXY_URL:-}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://immo.autoacts.link,http://localhost:4000,http://127.0.0.1:4000}
    expose:
      - "3001"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://immo.autoacts.link}
    expose:
      - "3000"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
